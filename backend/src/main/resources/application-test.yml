# =====================================================================
# 单元测试 / 集成测试 profile：H2 内存库
# 与 local 的区别：内存库每次构建都是干净的，测试之间不会互相污染，
# 也保证 `mvn test` 不依赖任何外部服务（MySQL、Redis 都不需要）。
# =====================================================================
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:suite_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/h2/schema.sql
      data-locations: classpath:db/h2/data.sql
      continue-on-error: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    root: WARN
    com.painuo.suite: INFO

app:
  jwt:
    secret: test-only-secret-key-with-enough-length-32bytes
    access-token-seconds: 3600
    refresh-token-seconds: 86400
    issuer: business-suite-test
  cache:
    type: memory
    default-ttl-seconds: 60
    null-value-ttl-seconds: 5
    ttl-jitter-ratio: 0.1
  ai:
    provider: mock
  storage:
    type: local
    local-root: ./target/test-uploads
    public-base-url: http://localhost:8080/uploads
  wechat:
    mock: true
