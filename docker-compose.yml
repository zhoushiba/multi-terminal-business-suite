# =====================================================================
# 多端业务中台套件 · 一键编排（MySQL 8 + Spring Boot 后端 + Nginx 管理后台）
#
# 用法（需要 Docker / Docker Compose）：
#   1. cp .env.example .env 并修改 DB_PASSWORD / APP_JWT_SECRET / MYSQL_ROOT_PASSWORD
#   2. docker compose up -d --build
#   3. 管理后台 http://localhost:8081   后端 http://localhost:8080/api/ping
#
# 说明：本机未安装 Docker，未实际执行本文件；服务拆分与变量与 .env.example 保持一致。
# =====================================================================
services:
  mysql:
    image: mysql:8.0
    container_name: suite-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-change-me}
      MYSQL_DATABASE: ${DB_NAME:-business_suite}
      MYSQL_USER: ${DB_USERNAME:-suite}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建库建表 + 灌种子数据
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - suite-net

  backend:
    build:
      context: ./backend
    image: business-suite-backend:1.0.0
    container_name: suite-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-business_suite}
      DB_USERNAME: ${DB_USERNAME:-suite}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET 必须至少 32 字节，请在 .env 中配置}
      # 未部署 Redis 时用 memory 缓存实现，功能不受影响
      APP_CACHE_TYPE: ${APP_CACHE_TYPE:-memory}
      APP_REDIS_URI: ${APP_REDIS_URI:-redis://redis:6379}
      APP_AI_PROVIDER: ${APP_AI_PROVIDER:-mock}
      APP_AI_BASE_URL: ${APP_AI_BASE_URL:-https://api.openai.com/v1}
      APP_AI_API_KEY: ${APP_AI_API_KEY:-}
      APP_AI_MODEL: ${APP_AI_MODEL:-gpt-4o-mini}
      APP_WECHAT_APP_ID: ${APP_WECHAT_APP_ID:-}
      APP_WECHAT_APP_SECRET: ${APP_WECHAT_APP_SECRET:-}
      APP_WECHAT_MOCK: ${APP_WECHAT_MOCK:-true}
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-local}
      APP_STORAGE_LOCAL_ROOT: /data/suite/uploads
      APP_STORAGE_PUBLIC_BASE_URL: ${APP_STORAGE_PUBLIC_BASE_URL:-http://localhost:8080/uploads}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8081}
    ports:
      - "8080:8080"
    volumes:
      - suite-uploads:/data/suite/uploads
      - suite-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - suite-net

  frontend:
    build:
      context: ./frontend
    image: business-suite-admin:1.0.0
    container_name: suite-admin
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8081}:80"
    networks:
      - suite-net

  # 可选：需要真实 Redis 缓存时执行 `docker compose --profile cache up -d`
  redis:
    image: redis:7-alpine
    container_name: suite-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles:
      - cache
    networks:
      - suite-net

volumes:
  mysql-data:
  suite-uploads:
  suite-logs:
  redis-data:

networks:
  suite-net:
    driver: bridge
